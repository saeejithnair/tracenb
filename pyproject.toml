[project]
name = "tracenb"
version = "0.1.0"
description = "Open any agent trace as an executable, forkable notebook. Swap the runtime between cells."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tracenb = "tracenb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracenb"]

[dependency-groups]
dev = ["pytest>=8"]
